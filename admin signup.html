<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="beusync">
    <meta name="description" content="BeauSync is a salon management system">
    <link rel="stylesheet" href="style.css">
    <script src="animation.js" defer></script>
    <title>Beausync: Salon Management System</title>
  </head>
  <body>
    <header>
        <i class='bx bx-menu' id="menu-icon"></i>
        <nav class="navbar">
        <a href="index.html" class="active">Home</a>
        <a href="booking.html">Booking</a>
        <a href="service.html">Service</a>
        <a href="inventory.html">Inventory</a>
        <a href="admin login.html">Admin Login</a>
        <a href="supplier login.html">Supplier Login</a>

      </nav>
    </header>

    <!-- Signup Title -->
    <div class="signup-title">
      <h1>Admin Sign Up</h1>
    </div>

    <!-- Signup Form -->
    <table>
      <form>
        <tr>
          <td><label for="fullname">Full Name:</label></td>
          <td><input type="text" id="fullname" name="fullname" required></td>
        </tr>

        <tr>
          <td><label for="email">Email:</label></td>
          <td><input type="email" id="email" name="email" required></td>
        </tr>

        <tr>
          <td><label for="username">Username:</label></td>
          <td><input type="text" id="username" name="username" required></td>
        </tr>

        <tr>
          <td><label for="password">Password:</label></td>
          <td><input type="password" id="password" name="password" required></td>
        </tr>

        <tr>
          <td><label for="confirm-password">Confirm Password:</label></td>
          <td><input type="password" id="confirm-password" name="confirm-password" required></td>
        </tr>

        <tr>
          <td colspan="2">
            <button type="submit">Sign Up</button>
          </td>
        </tr>
      </form>
    </table>

    <!-- Login Link -->
    <div class="signup-title">
      <p>Already have an account?</p>

      <a href="admin login.html">
        <h3>Admin Log In</h3>
      </a>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="navigation">
        <h4>Navigation</h4>
        <ul style="list-style: none; padding: 0; margin: 0;">
          <li><a href="index.html">Home</a></li>
          <li><a href="booking.html">Booking</a></li>
          <li><a href="service.html">Service</a></li>
          <li><a href="inventory.html">Inventory</a></li>
        </ul>
      </div>
      <p class="copywrite">© 2026 BeauSync. All rights reserved.</p>
    </footer>
  </body>
</html>
